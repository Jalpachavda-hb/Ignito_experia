name: Ignito Experia CI/CD

on:
  push:
    branches:
      - main

# Required GitHub Actions secrets for deploy:
#   EC2_HOST      - e.g. 3.7.254.15 or experia.ignitolearn.com
#   EC2_USER      - e.g. ubuntu
#   EC2_SSH_KEY   - private key (.pem contents)
# Optional:
#   DEPLOY_PATH   - defaults to /opt/ignitoexperia
#   APP_URL       - defaults to https://experia.ignitolearn.com

jobs:
  backend-main:
    name: Backend (Main) - Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

  backend-saas:
    name: Backend (SaaS Owner) - Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ignito_Experia_Main_Dashboard/Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ignito_Experia_Main_Dashboard/Backend

  frontend-saas:
    name: Frontend (SaaS Admin) - Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ignito_Experia_Main_Dashboard/ignito_experia_admin/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ignito_Experia_Main_Dashboard/ignito_experia_admin

      - name: Run Lint
        run: npm run lint
        working-directory: ignito_Experia_Main_Dashboard/ignito_experia_admin
        continue-on-error: true

      - name: Run Build
        env:
          VITE_API_URL: https://experia.ignitolearn.com/owner-api
          VITE_BASE: /owner/
        run: npm run build -- --base=/owner/
        working-directory: ignito_Experia_Main_Dashboard/ignito_experia_admin

  frontend-vlab-admin:
    name: Frontend (VLab Admin) - Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vlab_admin/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: vlab_admin

      - name: Verify Code Formatting
        run: npm run format:check
        working-directory: vlab_admin
        continue-on-error: true

      - name: Run Lint
        run: npm run lint
        working-directory: vlab_admin
        continue-on-error: true

      - name: Run Build
        env:
          VITE_API_BASE_URL: https://experia.ignitolearn.com/api
        run: npm run build
        working-directory: vlab_admin

      - name: Install Playwright Browsers (for Vitest)
        run: npx playwright install chromium --with-deps
        working-directory: vlab_admin
        continue-on-error: true

      - name: Run Vitest Headless Browser Tests
        run: npm run test
        working-directory: vlab_admin
        continue-on-error: true

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-main
      - backend-saas
      - frontend-saas
      - frontend-vlab-admin
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/ignitoexperia}"
            APP_URL="${{ secrets.APP_URL }}"
            APP_URL="${APP_URL:-https://experia.ignitolearn.com}"

            cd "$DEPLOY_PATH"

            echo "==> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Main backend deps"
            cd "$DEPLOY_PATH/backend"
            npm ci

            echo "==> Owner backend deps"
            cd "$DEPLOY_PATH/ignito_Experia_Main_Dashboard/Backend"
            npm ci

            echo "==> VLab admin build"
            cd "$DEPLOY_PATH/vlab_admin"
            npm ci --legacy-peer-deps
            VITE_API_BASE_URL="$APP_URL/api" npm run build

            echo "==> Owner admin build"
            cd "$DEPLOY_PATH/ignito_Experia_Main_Dashboard/ignito_experia_admin"
            npm ci --legacy-peer-deps
            VITE_API_URL="$APP_URL/owner-api" npm run build -- --base=/owner/

            echo "==> Restart PM2 apps"
            pm2 restart vlab-api owner-api || {
              pm2 start "$DEPLOY_PATH/backend/index.js" --name vlab-api
              pm2 start "$DEPLOY_PATH/ignito_Experia_Main_Dashboard/Backend/index.js" --name owner-api
            }
            pm2 save

            echo "==> Waiting for APIs to come up"
            sleep 5

            echo "==> Health checks"
            if systemctl is-active --quiet mysql || systemctl is-active --quiet mysqld; then
              echo "OK: MySQL is active"
            else
              echo "FAIL: MySQL is not active"
              exit 1
            fi

            if systemctl is-active --quiet nginx; then
              echo "OK: Nginx is active"
            else
              echo "FAIL: Nginx is not active"
              exit 1
            fi

            VLAB_STATUS="$(pm2 jlist | python3 -c "import sys,json; apps={a['name']:a['pm2_env']['status'] for a in json.load(sys.stdin)}; print(apps.get('vlab-api','missing'))")"
            OWNER_STATUS="$(pm2 jlist | python3 -c "import sys,json; apps={a['name']:a['pm2_env']['status'] for a in json.load(sys.stdin)}; print(apps.get('owner-api','missing'))")"
            echo "PM2 vlab-api=$VLAB_STATUS owner-api=$OWNER_STATUS"
            [ "$VLAB_STATUS" = "online" ] || { echo "FAIL: vlab-api is not online"; exit 1; }
            [ "$OWNER_STATUS" = "online" ] || { echo "FAIL: owner-api is not online"; exit 1; }

            curl -fsS "http://127.0.0.1:8080/api/health" >/dev/null
            echo "OK: Main API /api/health"
            curl -fsS "http://127.0.0.1:8080/api/health/database" >/dev/null
            echo "OK: Main API /api/health/database"

            # Build output must exist (Nginx roots point at these)
            test -f "$DEPLOY_PATH/vlab_admin/dist/index.html" || {
              echo "FAIL: missing vlab_admin/dist/index.html"; exit 1;
            }
            test -f "$DEPLOY_PATH/ignito_Experia_Main_Dashboard/ignito_experia_admin/dist/index.html" || {
              echo "FAIL: missing owner admin dist/index.html"; exit 1;
            }
            echo "OK: frontend dist/index.html files present"

            # Curl with Host header — bare 127.0.0.1 hits default_server (often 404),
            # not the experia.ignitolearn.com vhost Certbot configured.
            HOST_HEADER="$(python3 -c "from urllib.parse import urlparse; print(urlparse('${APP_URL}').hostname or 'experia.ignitolearn.com')")"
            HTTP_ROOT="$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: $HOST_HEADER" http://127.0.0.1/)"
            HTTP_OWNER="$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: $HOST_HEADER" http://127.0.0.1/owner/)"
            echo "HTTP Host=$HOST_HEADER / => $HTTP_ROOT ; /owner/ => $HTTP_OWNER"
            echo "$HTTP_ROOT" | grep -Eq '200|301|302' || {
              echo "FAIL: unexpected status for /"; exit 1;
            }
            echo "$HTTP_OWNER" | grep -Eq '200|301|302' || {
              echo "FAIL: unexpected status for /owner/"; exit 1;
            }

            echo "==> Deploy complete (MySQL, Nginx, PM2, HTTP OK)"
